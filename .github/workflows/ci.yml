name: CI
on: [push, pull_request]

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q trading_agent bridge.py guard.py ibkr_operator.py
      - run: python -m ruff check .
      - run: python -m ruff check --select F401,F841 trading_agent/operations.py trading_agent/recovery.py trading_agent/evaluation_evidence.py trading_agent/cli/operator_registry.py trading_agent/cli/operator_options.py trading_agent/cli/operator_output.py
      - run: python -m mypy --no-incremental trading_agent
      - run: python scripts/run_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-results-${{ matrix.os }}
          path: .test-results/
          include-hidden-files: true
