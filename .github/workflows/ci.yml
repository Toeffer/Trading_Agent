# ============================================================================
# IBKR Bridge — CI Workflow
#
# Pure Level 1 safety test layer only.
# No IBKR Gateway, ~/.openclaw, H1 token, systemd, or broker credentials required.
# Uses the curated local CI runner so GitHub and local CI execute the same scope.
# ============================================================================

name: CI

on:
  push:
    branches: [main, master, 'phase*', 'ci-*', 'claude/*']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Compile check
        run: |
          python -m py_compile bridge.py guard.py ibkr_operator.py

      - name: Run curated Level 1 CI suite
        run: |
          chmod +x scripts/run-ci-portable
          scripts/run-ci-portable
