# ============================================================================
# IBKR Bridge — CI Workflow (Phase 16Z)
#
# Pure Level 1 safety test layer only.
# No IBKR Gateway, ~/.openclaw, H1 token, systemd, or broker credentials required.
# Excludes acceptance / integration / live / host tests via marker filter.
# ============================================================================

name: CI

on:
  push:
    branches: [main, master, 'phase*']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Compile check (fail-fast)
        run: |
          python -m py_compile bridge.py guard.py ibkr_operator.py

      - name: Collection check (pure tests only)
        run: |
          python -m pytest --collect-only -q tests/ \
            -m "not integration and not live and not acceptance"

      - name: Run pure tests (Level 1 safety layer)
        run: |
          python -m pytest tests/ \
            -m "not integration and not live and not acceptance" \
            -v \
            --tb=short \
            --timeout=120
