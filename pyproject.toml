[project]
name = "ibkr-openclaw-bridge"
version = "0.0.0"
description = "IBKR paper-trading bridge, risk guard, and read-only operator tooling for the OpenClaw/Werner runtime. See CLAUDE.md for safety invariants and RUNBOOK.md for operator procedures."
requires-python = ">=3.12"
readme = "README.md"

# Runtime dependencies are pinned in requirements.txt (pip install -r
# requirements.txt) rather than duplicated here, to avoid two sources of
# truth for the same version pins.

[tool.ruff]
target-version = "py312"
exclude = [".venv", ".test-tmp", ".test-results"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "unit: isolated unit behavior",
  "portable: offline and independent of production host configuration",
  "integration: explicit external integration",
  "live: requires a connected broker",
  "host: requires the Linux deployment host",
  "acceptance: human-initiated paper acceptance",
  "slow: slower deterministic checks",
]

[tool.mypy]
python_version = "3.12"
files = ["trading_agent"]
strict = true

[[tool.mypy.overrides]]
module = ["trading_agent.legacy_guard", "trading_agent.http_compat", "trading_agent.cli.operator_legacy", "trading_agent.cli.operator_registry", "trading_agent.cli.operator_options", "trading_agent.cli.operator_workflow", "trading_agent.cli.operator_phase16", "trading_agent.cli.operator_phase17", "trading_agent.cli.operator_research", "trading_agent.cli.operator_common", "trading_agent.cli.operator_output", "trading_agent.cli.operator_fixtures", "trading_agent.cli.operator_workflow_helpers", "trading_agent.cli.operator_governance_helpers", "trading_agent.cli.operator_research_helpers"]
ignore_errors = true
# This repo's f-string usage relies on PEP 701's relaxed grammar (nested
# quotes, backslashes inside the expression part), which only parses under
# Python 3.12+ -- see CHANGELOG.md's notes on the python3.11-vs-3.12
# py_compile mismatch encountered repeatedly during development.

[tool.ruff.lint]
# The full default rule set is noisy on a codebase this size and wasn't
# enforced from the start (see CHANGELOG.md's Fable-code-review entries).
# Start the CI gate on the subset that caught real, previously-hidden bugs
# this pass: undefined names (F821 -- two functions silently no-op'd
# forever), use-before-import (F823 -- an UnboundLocalError-shaped bug
# hitting a dozen+ call sites in one function), duplicate dict keys (F601 --
# a value silently discarded), and a shadowed import (F402). F811
# (redefinition) is not enabled yet: ~66 pre-existing instances in tests/
# are a harmless repeated-local-reimport idiom (MagicMock/patch/tempfile
# etc. re-imported inside individual test methods, already imported at
# module scope) that would need a mechanical cleanup pass of its own before
# this gate could go green on it -- tracked as a follow-up, not done here.
# Broadening this selection further (F401 unused imports, F841 unused
# variables, F541 pointless f-strings -- all confirmed cosmetic, not
# correctness-relevant) is also a follow-up, not part of this change.
# F811 (redefinition of an unused name) added 2026-09-07 for production
# files: Phase 19P's cleanup left them clean, and the CI gate now keeps them
# that way. tests/ keeps its harmless repeated-local-reimport idiom for now
# (per-file ignore below) — still the mechanical follow-up noted above.
select = ["F821", "F823", "F601", "F402", "F811"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]

# Historical root modules reached from compatibility code are outside the
# typed execution boundaries. New trading_agent modules remain strictly checked.
[[tool.mypy.overrides]]
module = ["dry_run_scenarios", "guard", "monitor", "strategy_v1_1_core"]
follow_imports = "skip"
